<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Calcufolio — flux d’interaction et moteur d’expressions</title>
<desc id="desc">Entrées Avalonia vers les contrôleurs applicatifs, puis vers le moteur d’expressions composé du tokenizer, parser, evaluator et CalculationEngine.</desc>
<defs>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto-start-reverse">
    <path d="M0,0 L12,6 L0,12 z" fill="#334155"/>
  </marker>
  <style>
    .heading { font: 700 40px Inter, system-ui, sans-serif; fill: #0f172a; }
    .subtitle { font: 400 20px Inter, system-ui, sans-serif; fill: #475569; }
    .title { font-family: Inter, system-ui, sans-serif; font-weight: 700; fill: #0f172a; }
    .body { font-family: Inter, system-ui, sans-serif; font-weight: 400; fill: #475569; }
    .edge { font: 600 16px Inter, system-ui, sans-serif; fill: #475569; paint-order: stroke; stroke: #f8fafc; stroke-width: 8px; stroke-linejoin: round; }
    .note { font: 500 17px Inter, system-ui, sans-serif; fill: #475569; }
  </style>
</defs>
<rect width="1600" height="900" fill="#f8fafc"/>
<text x="70" y="70" class="heading">Calcufolio — flux d’interaction et moteur d’expressions</text>
<text x="70" y="108" class="subtitle">.NET 10 · Avalonia · couches Presentation / Application / Domain</text>
<rect x="60" y="300" width="220" height="150" rx="22" fill="#cffafe" stroke="#334155" stroke-width="2"/>
<text x="84" y="338" class="title" font-size="24">Utilisateur</text>
<text x="84" y="370" class="body" font-size="18">Clavier, souris,</text>
<text x="84" y="398" class="body" font-size="18">sélection,</text>
<text x="84" y="426" class="body" font-size="18">presse-papiers</text><rect x="350" y="170" width="300" height="180" rx="22" fill="#e0e7ff" stroke="#334155" stroke-width="2"/>
<text x="374" y="208" class="title" font-size="24">Presentation / Avalonia</text>
<text x="374" y="240" class="body" font-size="18">MainWindow + MainViewModel</text>
<text x="374" y="268" class="body" font-size="18">KeyboardInputRouter</text>
<text x="374" y="296" class="body" font-size="18">SelectionInputAdapter</text>
<text x="374" y="324" class="body" font-size="18">AvaloniaClipboardPort</text><rect x="350" y="500" width="300" height="150" rx="22" fill="#dbeafe" stroke="#334155" stroke-width="2"/>
<text x="374" y="538" class="title" font-size="24">État UI</text>
<text x="374" y="570" class="body" font-size="18">Feedback visuel</text>
<text x="374" y="598" class="body" font-size="18">historique / preview</text><rect x="740" y="170" width="310" height="250" rx="22" fill="#fef3c7" stroke="#334155" stroke-width="2"/>
<text x="764" y="208" class="title" font-size="24">Application</text>
<text x="764" y="240" class="body" font-size="18">CalculatorController</text>
<text x="764" y="268" class="body" font-size="18">CalculatorStateStore</text>
<text x="764" y="296" class="body" font-size="18">EditorStateReducer</text>
<text x="764" y="324" class="body" font-size="18">CalculationPreviewService</text>
<text x="764" y="352" class="body" font-size="18">ClipboardController</text><rect x="740" y="540" width="310" height="120" rx="22" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
<text x="764" y="578" class="title" font-size="24">ExpressionEvaluationService</text>
<text x="764" y="610" class="body" font-size="18">Façade applicative</text>
<text x="764" y="638" class="body" font-size="18">d’évaluation</text><rect x="1140" y="130" width="330" height="120" rx="22" fill="#dcfce7" stroke="#334155" stroke-width="2"/>
<text x="1164" y="168" class="title" font-size="24">ExpressionEngine</text>
<text x="1164" y="200" class="body" font-size="18">Orchestre parsing + évaluation</text><rect x="1100" y="330" width="180" height="110" rx="22" fill="#dcfce7" stroke="#334155" stroke-width="2"/>
<text x="1124" y="368" class="title" font-size="22">Tokenizer</text>
<text x="1124" y="400" class="body" font-size="16">ExpressionTokenizer</text><rect x="1320" y="330" width="180" height="110" rx="22" fill="#dcfce7" stroke="#334155" stroke-width="2"/>
<text x="1344" y="368" class="title" font-size="22">Parser</text>
<text x="1344" y="400" class="body" font-size="16">ExpressionParser</text><rect x="1100" y="520" width="180" height="110" rx="22" fill="#dcfce7" stroke="#334155" stroke-width="2"/>
<text x="1124" y="558" class="title" font-size="22">Evaluator</text>
<text x="1124" y="590" class="body" font-size="16">ExpressionEvaluator</text><rect x="1320" y="520" width="180" height="110" rx="22" fill="#dcfce7" stroke="#334155" stroke-width="2"/>
<text x="1344" y="558" class="title" font-size="22">Calculs</text>
<text x="1344" y="590" class="body" font-size="16">CalculationEngine</text><rect x="1130" y="700" width="330" height="90" rx="22" fill="#fff7ed" stroke="#334155" stroke-width="2" stroke-dasharray="10 8"/>
<text x="1154" y="738" class="title" font-size="22">Infrastructure</text>
<text x="1154" y="770" class="body" font-size="16">Projet présent mais sans</text>
<text x="1154" y="796" class="body" font-size="16">implémentation runtime auditée</text><line x1="280" y1="375" x2="350" y2="270" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
<text x="315.0" y="312.5" text-anchor="middle" class="edge">événements</text><line x1="650" y1="270" x2="740" y2="270" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
<text x="695.0" y="260.0" text-anchor="middle" class="edge">actions / sélection</text><line x1="740" y1="350" x2="650" y2="575" stroke="#334155" stroke-width="3" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<text x="695.0" y="452.5" text-anchor="middle" class="edge">état / preview</text><line x1="895" y1="420" x2="895" y2="540" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
<text x="895.0" y="470.0" text-anchor="middle" class="edge">évaluer</text><line x1="1050" y1="600" x2="1140" y2="190" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
<text x="1095.0" y="385.0" text-anchor="middle" class="edge">ExpressionEngine</text><line x1="1230" y1="250" x2="1190" y2="330" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
<text x="1210.0" y="280.0" text-anchor="middle" class="edge">lexing</text><line x1="1280" y1="385" x2="1320" y2="385" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
<text x="1300.0" y="375.0" text-anchor="middle" class="edge">tokens</text><line x1="1410" y1="440" x2="1190" y2="520" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
<text x="1300.0" y="470.0" text-anchor="middle" class="edge">AST</text><line x1="1280" y1="575" x2="1320" y2="575" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
<text x="1300.0" y="565.0" text-anchor="middle" class="edge">opérations</text><text x="70" y="860" class="note">Aucune persistance n’est représentée : la révision auditée ne contient pas d’implémentation runtime dans Calcufolio.Infrastructure.</text>
</svg>

<text x="895.0" y="470.0" text-anchor="middle" class="edge">évaluer</text><path d="M1050 600 H1070 V275 L1140 190" fill="none" stroke="#334155" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="1058" y="455" text-anchor="end" class="edge">moteur</text><line x1="1230" y1="250" x2="1190" y2="330" stroke="#334155" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="1210.0" y="280.0" text-anchor="middle" class="edge">lexing</text><line x1="1280" y1="385" x2="1320" y2="385" stroke="#334155" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="1300" y="374" text-anchor="middle" class="edge">tokens</text><line x1="1410" y1="440" x2="1190" y2="520" stroke="#334155" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="1300.0" y="470.0" text-anchor="middle" class="edge">AST</text><line x1="1280" y1="575" x2="1320" y2="575" stroke="#334155" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="1300" y="564" text-anchor="middle" class="edge">opérations</text><text x="70" y="860" class="note">Aucune persistance n’est représentée : la révision auditée ne contient pas d’implémentation runtime dans Calcufolio.Infrastructure.</text>

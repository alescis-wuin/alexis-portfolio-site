<text x="315.0" y="312.5" text-anchor="middle" class="edge">événements</text><line x1="650" y1="270" x2="740" y2="270" stroke="#334155" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="695.0" y="260.0" text-anchor="middle" class="edge">actions / sélection</text><line x1="740" y1="350" x2="650" y2="575" stroke="#334155" stroke-width="2.4" marker-end="url(#arrow)" marker-start="url(#arrow)"/>

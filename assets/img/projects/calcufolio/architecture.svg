<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Calcufolio — flux d’interaction et moteur d’expressions</title>
<desc id="desc">Entrées Avalonia vers les contrôleurs applicatifs, puis vers le moteur d’expressions composé du tokenizer, parser, evaluator et CalculationEngine.</desc>
<defs>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse" viewBox="0 0 9 9">
    <path d="M0,0 L9,4.5 L0,9 z" fill="#334155"/>
  </marker>
  <style>
    .heading { font: 700 30px Inter, system-ui, sans-serif; fill: #0f172a; }
    .subtitle { font: 400 16px Inter, system-ui, sans-serif; fill: #475569; }
    .title { font-family: Inter, system-ui, sans-serif; font-weight: 700; fill: #0f172a; }
    .body { font-family: Inter, system-ui, sans-serif; font-weight: 400; fill: #475569; }
    .edge { font: 600 13px Inter, system-ui, sans-serif; fill: #475569; paint-order: stroke; stroke: #f8fafc; stroke-width: 5px; stroke-linejoin: round; }
    .note { font: 500 14px Inter, system-ui, sans-serif; fill: #475569; }
  </style>
</defs>
<rect width="1600" height="900" fill="#f8fafc"/>
<text x="70" y="70" class="heading">Calcufolio — flux d’interaction et moteur d’expressions</text>
<text x="70" y="108" class="subtitle">.NET 10 · Avalonia · couches Presentation / Application / Domain</text>
<rect x="60" y="300" width="220" height="150" rx="22" fill="#cffafe" stroke="#334155" stroke-width="2"/>
<text x="84" y="338" class="title" font-size="20">Utilisateur</text>
<text x="84" y="370" class="body" font-size="15">Clavier, souris,</text>
<text x="84" y="398" class="body" font-size="15">sélection,</text>
<text x="84" y="426" class="body" font-size="15">presse-papiers</text><rect x="350" y="170" width="300" height="180" rx="22" fill="#e0e7ff" stroke="#334155" stroke-width="2"/>
<text x="374" y="208" class="title" font-size="20">Presentation / Avalonia</text>
<text x="374" y="240" class="body" font-size="15">MainWindow + MainViewModel</text>
<text x="374" y="268" class="body" font-size="15">KeyboardInputRouter</text>
<text x="374" y="296" class="body" font-size="15">SelectionInputAdapter</text>
<text x="374" y="324" class="body" font-size="15">AvaloniaClipboardPort</text><rect x="350" y="500" width="300" height="150" rx="22" fill="#dbeafe" stroke="#334155" stroke-width="2"/>
<text x="374" y="538" class="title" font-size="20">État UI</text>
<text x="374" y="570" class="body" font-size="15">Feedback visuel</text>
<text x="374" y="598" class="body" font-size="15">historique / preview</text><rect x="740" y="170" width="310" height="250" rx="22" fill="#fef3c7" stroke="#334155" stroke-width="2"/>
<text x="764" y="208" class="title" font-size="20">Application</text>
<text x="764" y="240" class="body" font-size="15">CalculatorController</text>
<text x="764" y="268" class="body" font-size="15">CalculatorStateStore</text>
<text x="764" y="296" class="body" font-size="15">EditorStateReducer</text>

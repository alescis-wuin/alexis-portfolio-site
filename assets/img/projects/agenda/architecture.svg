<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Agenda — architecture multi-hôte</title>
<desc id="desc">Web Blazor, MAUI Blazor Hybrid et API partagent les cas d’usage ; Web et MAUI réutilisent les mêmes composants Razor ; chaque hôte persiste via EF Core et SQLite.</desc>

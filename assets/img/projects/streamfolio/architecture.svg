<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Streamfolio — architecture applicative et pipeline média</title>
<desc id="desc">Client web, application Spring Boot, données PostgreSQL, sessions Redis, stockage objet MinIO et pipeline média persistant avec FFmpeg local.</desc>
<defs>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse" viewBox="0 0 9 9">
    <path d="M0,0 L9,4.5 L0,9 z" fill="#334155"/>
  </marker>
  <style>
    .heading { font: 700 30px Inter, system-ui, sans-serif; fill: #0f172a; }
    .subtitle { font: 400 16px Inter, system-ui, sans-serif; fill: #475569; }
    .title { font-family: Inter, system-ui, sans-serif; font-weight: 700; fill: #0f172a; }
    .body { font-family: Inter, system-ui, sans-serif; font-weight: 400; fill: #475569; }
    .edge { font: 600 13px Inter, system-ui, sans-serif; fill: #475569; paint-order: stroke; stroke: #f8fafc; stroke-width: 5px; stroke-linejoin: round; }
    .note { font: 500 14px Inter, system-ui, sans-serif; fill: #475569; }
  </style>
</defs>

name: Testing PR

on:
  pull_request:
    branches:
      - testing
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testing-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  guard-source-and-sync:
    name: Guard source and sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate source branch
        run: |
          set -euo pipefail
          head="${{ github.head_ref }}"
          case "$head" in
            develop|main)
              echo "Allowed source branch for testing: $head"
              ;;
            *)
              echo "Only develop or main can be merged into testing."
              exit 1
              ;;
          esac

      - name: Ensure promotion line contains current main
        run: |
          set -euo pipefail
          head="${{ github.head_ref }}"
          if [ "$head" = "main" ]; then
            echo "Main sync PR detected; testing is being aligned with main."
            exit 0
          fi

          git fetch origin main
          base_sha="${{ github.event.pull_request.base.sha }}"
          head_sha="${{ github.event.pull_request.head.sha }}"

          if git merge-base --is-ancestor origin/main "$base_sha"; then
            echo "testing already contains current main."
            exit 0
          fi

          if git merge-base --is-ancestor origin/main "$head_sha"; then
            echo "develop contains current main; allowing history-recovery promotion."
            exit 0
          fi

          if git diff --quiet origin/main "$base_sha"; then
            echo "testing content matches main despite divergent history."
            exit 0
          fi

          echo "Neither testing nor develop contains current main."
          echo "Synchronize main into the promotion line before promoting develop."
          git diff --stat origin/main "$base_sha" || true
          exit 1

  release-candidate-checks:
    name: Release candidate checks
    needs: guard-source-and-sync
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
      - name: Run checks for develop promotion only
        run: |
          set -euo pipefail
          head="${{ github.head_ref }}"
          if [ "$head" = "main" ]; then
            echo "Main sync PR detected; release candidate checks are not required."
            exit 0
          fi

          npx playwright install --with-deps chromium
          npm run check:strict
          npm run capture:visual

      - name: Upload visual QA artifact
        if: always() && github.head_ref == 'develop'
        uses: actions/upload-artifact@v7
        with:
          name: visual-qa-testing-pr-${{ github.event.pull_request.number || github.run_id }}
          path: artifacts/visual
          if-no-files-found: warn
          retention-days: 14

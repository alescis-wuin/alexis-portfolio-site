name: Promote Testing to Main

on:
  push:
    branches:
      - testing
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: promote-testing-to-main
  cancel-in-progress: false

jobs:
  open-or-update-pr:
    name: Open or update PR testing to main
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create PR if missing
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          existing_pr="$(
            gh pr list \
              --repo "$REPO" \
              --base main \
              --head testing \
              --state open \
              --json number \
              --jq '.[0].number // empty'
          )"

          if [[ -n "$existing_pr" ]]; then
            echo "PR testing -> main already exists: #$existing_pr"
          else
            gh pr create \
              --repo "$REPO" \
              --base main \
              --head testing \
              --title "release: promote testing to main" \
              --body "Automatic release candidate promotion from testing to main."
          fi

name: Temporary portfolio project sync

on:
  push:
    branches:
      - portfolio/1.2-project-data

permissions:
  contents: write

jobs:
  sync-generated-projects:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: portfolio/1.2-project-data
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Rebuild minimal canonical project data
        env:
          SOURCE_OF_TRUTH_COMMIT: e0923527c42db65e4fcef8c4b6f390aa03913eb5
        run: |
          cp data/projects.json /tmp/current-projects.json
          git show "$SOURCE_OF_TRUTH_COMMIT:data/projects.json" > /tmp/base-projects.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const base = JSON.parse(fs.readFileSync('/tmp/base-projects.json', 'utf8'));
          const current = JSON.parse(fs.readFileSync('/tmp/current-projects.json', 'utf8'));
          const byId = new Map(current.projects.map((project) => [project.id, project]));

          base.taxonomy.types.ai = current.taxonomy.types.ai;
          for (const key of ['java-26', 'llama-cpp', 'hugging-face', 'gguf']) {
            base.taxonomy.stack[key] = current.taxonomy.stack[key];
          }

          for (const project of base.projects) {
            project.featured = false;
            delete project.featuredOrder;
          }

          const streamfolio = base.projects.find((project) => project.id === 'streamfolio');
          const agenda = base.projects.find((project) => project.id === 'agenda');
          streamfolio.featured = true;
          streamfolio.featuredOrder = 2;
          agenda.featured = true;
          agenda.featuredOrder = 3;

          const aeliaIndex = base.projects.findIndex((project) => project.id === 'aelia');
          const aelia = structuredClone(byId.get('aelia'));
          aelia.featured = true;
          aelia.featuredOrder = 4;
          base.projects[aeliaIndex] = aelia;

          const alycia = structuredClone(byId.get('alycia'));
          alycia.featured = true;
          alycia.featuredOrder = 1;
          base.projects.push(alycia);

          fs.writeFileSync('data/projects.json', `${JSON.stringify(base)}\n`);
          NODE
          npx prettier --write data/projects.json

      - name: Regenerate project surfaces
        run: npm run generate

      - name: Verify generated project surfaces
        run: |
          npm run generate:check
          node scripts/validate-static-site.mjs

      - name: Commit synchronized outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/projects.json index.html sitemap.xml projets/
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git commit -m 'fix(projects): preserve canonical project history'
          git push origin HEAD:portfolio/1.2-project-data
